<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch · Status</title>
  <!--
    Build-less React (ADR-011): React + htm loaded from an ESM CDN, no npm/Vite. In
    prod this becomes a fingerprinted bundle on S3 + CloudFront (short-TTL index.html,
    long-TTL assets — ADR-005). Point WATCH_API at the API origin.
  -->
  <script>window.WATCH_API = "http://localhost:8010";</script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f1f5f9; color: #1e293b; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    header h1 { font-size: 20px; margin: 0; }
    .sub { color: #64748b; font-size: 13px; }
    .banner { border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-weight: 600; }
    .banner.ok { background: #dcfce7; color: #166534; }
    .banner.degraded { background: #fef9c3; color: #854d0e; }
    .banner.unreachable { background: #fee2e2; color: #991b1b; }
    .banner small { display: block; font-weight: 400; margin-top: 4px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06); text-align: center; }
    .card .value { font-size: 28px; font-weight: 700; }
    .card .value.warn { color: #b45309; } .card .value.crit { color: #b91c1c; } .card .value.good { color: #15803d; }
    .card .label { color: #64748b; font-size: 13px; margin-top: 4px; }
    .muted { color: #64748b; } footer { color: #94a3b8; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
