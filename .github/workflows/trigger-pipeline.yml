# Start the AWS CodePipeline on a push to main (platform#24). The native CodeConnections
# push trigger wouldn't deliver events, so we poke the pipeline via OIDC instead. This is
# trigger-only — CodePipeline still runs build -> DeployStaging -> approval -> DeployProd
# (the authoritative coverage/Sonar gates live in CodeBuild, ADR-004).
#
# To fire on release tags instead of every main push, swap the `on:` block for:
#   on:
#     push:
#       tags: ['v*']
#
# ON/OFF FLAG — gated on the `CD_ENABLED` repo variable so this doesn't fail on every push when the
# AWS estate is torn down (no `watch` pipeline to start). When CD_ENABLED != 'true' the job SKIPS
# (a neutral/grey run, not a red failure). Re-enable after standing the estate back up with:
#   gh variable set CD_ENABLED --body true      # disable again: gh variable set CD_ENABLED --body false
name: Trigger deploy pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # request the OIDC token to assume the AWS role
  contents: read

concurrency:
  group: trigger-deploy-pipeline
  cancel-in-progress: false

jobs:
  start:
    # Skip (don't fail) while CD is off — the estate/pipeline may not exist. See the header comment.
    if: vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The pipeline (and its OIDC trigger role) live in the nonprod build account (ADR-020).
          # ARN held as a repo secret so the account id stays out of this public repo.
          role-to-assume: ${{ secrets.AWS_CI_TRIGGER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Start CodePipeline
        run: |
          ID=$(aws codepipeline start-pipeline-execution --name watch --query pipelineExecutionId --output text)
          echo "Started pipeline execution: $ID"
          echo "### Started CodePipeline \`watch\` — execution \`$ID\`" >> "$GITHUB_STEP_SUMMARY"
