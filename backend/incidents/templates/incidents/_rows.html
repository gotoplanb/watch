<tbody id="incident-rows">
  {% for inc in incidents %}
  <tr class="border-b border-slate-800 last:border-0 hover:bg-slate-800/60">
    <td class="p-3">
      <a class="text-indigo-400 hover:text-indigo-300" href="{% url 'ui:incident_detail' inc.id %}">{{ inc.title }}</a>
    </td>
    <td class="p-3">
      {% if inc.status == 'RESOLVED' %}
        <span class="px-2 py-0.5 rounded text-xs bg-emerald-500/15 text-emerald-300">Resolved</span>
      {% else %}
        <span class="px-2 py-0.5 rounded text-xs bg-amber-500/15 text-amber-300">Open</span>
      {% endif %}
    </td>
    <td class="p-3"><span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-300">{{ inc.current_tier }}</span></td>
    <td class="p-3 text-slate-400">{{ inc.source }}</td>
    <td class="p-3 text-slate-500">{{ inc.created_at|date:"M j, H:i" }}</td>
  </tr>
  {% empty %}
  <tr><td class="p-6 text-center text-slate-500" colspan="5">No incidents match.</td></tr>
  {% endfor %}
</tbody>
