{% extends "base.html" %}
{% block title %}Incidents · Watch{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold text-slate-100 mb-4">Incidents</h1>

<form class="flex gap-3 mb-4 text-sm"
      hx-get="{% url 'ui:incident_list' %}" hx-target="#incident-rows" hx-swap="outerHTML"
      hx-trigger="change">
  <select name="status" class="border border-slate-700 rounded px-2 py-1 bg-slate-800 text-slate-200">
    <option value="">all statuses</option>
    {% for value, label in statuses %}
      <option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <select name="tier" class="border border-slate-700 rounded px-2 py-1 bg-slate-800 text-slate-200">
    <option value="">all tiers</option>
    {% for value, label in tiers %}
      <option value="{{ value }}" {% if value == tier %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</form>

<table class="w-full text-sm bg-slate-900 border border-slate-800 rounded overflow-hidden">
  <thead class="text-left text-slate-400 border-b border-slate-800">
    <tr>
      <th class="p-3 font-medium">Title</th>
      <th class="p-3 font-medium">Status</th>
      <th class="p-3 font-medium">Tier</th>
      <th class="p-3 font-medium">Source</th>
      <th class="p-3 font-medium">Created</th>
    </tr>
  </thead>
  {% include "incidents/_rows.html" %}
</table>
{% endblock %}
