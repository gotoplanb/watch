{% extends "base.html" %}
{% block title %}Incidents · Watch{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold text-slate-100 mb-4">Incidents</h1>

<form class="flex gap-3 mb-4 text-sm"
      hx-get="{% url 'ui:incident_list' %}" hx-target="#incident-results" hx-swap="outerHTML"
      hx-trigger="change">
  <select name="status" aria-label="Filter by status" class="border border-slate-700 rounded px-2 py-1 bg-slate-800 text-slate-200">
    <option value="">all statuses</option>
    {% for value, label in statuses %}
      <option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <select name="tier" aria-label="Filter by tier" class="border border-slate-700 rounded px-2 py-1 bg-slate-800 text-slate-200">
    <option value="">all tiers</option>
    {% for value, label in tiers %}
      <option value="{{ value }}" {% if value == tier %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</form>

{% include "incidents/_results.html" %}
{% endblock %}
