[project]
name = "watch-backend"
version = "0.2.0"
description = "Watch — incident intake & tiered escalation (Django/DRF, v1 slice)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
# Hermetic units never touch Docker/network (spec §6). Integration tests are marked
# and excluded here; run them with the compose stack up via `make integration`.
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs the docker-compose stack (Postgres, AppConfig Agent, SFN Local)",
]

[tool.coverage.run]
source = ["incidents", "config"]
branch = true
# Portable paths so the host-generated coverage.xml matches files inside the
# in-container SonarQube scanner.
relative_files = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    # Bootstrap / config — too thin to unit-test meaningfully.
    "manage.py",
    "config/settings*.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/otel.py",
    # Integration / CLI glue — exercised by integration tests + manual use, not units.
    "incidents/lambda_shim.py",
    "incidents/management/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
