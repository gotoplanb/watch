# SonarQube project config for Watch (backend). Scan via `make sonar-scan` from the
# repo root, which runs the scanner with this directory (backend/) as the base.
# Host URL + token are passed at scan time via env vars, not committed here.

sonar.projectKey=watch
sonar.projectName=Watch
sonar.projectVersion=0.1.0

# Python lives under backend/; the scanner runs with backend/ as the base dir, so
# sources/tests are relative to here. Tests are listed separately so SonarQube applies
# test-specific rules (allow asserts, etc.).
sonar.sources=incidents,config
sonar.tests=incidents/tests

# Exclusions — not analyzed for quality/security.
sonar.exclusions=\
  .venv/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  .pytest_cache/**,\
  .ruff_cache/**,\
  **/migrations/**,\
  **/templates/**,\
  incidents/tests/**,\
  config/settings_test.py,\
  config/settings_integration.py,\
  staticfiles/**,\
  htmlcov/**,\
  **/.DS_Store

# Repetitive fixture setup in tests is fine.
sonar.cpd.exclusions=incidents/tests/**

# Coverage-only exclusions — Sonar still runs static analysis on these, but they're
# omitted from the coverage metric. Kept in sync with [tool.coverage.run] omit in
# pyproject.toml: bootstrap/config + integration/CLI glue (the lambda shim and
# management commands are exercised by integration tests + manual use, not units).
sonar.coverage.exclusions=\
  manage.py,\
  config/settings*.py,\
  config/wsgi.py,\
  config/asgi.py,\
  config/otel.py,\
  incidents/lambda_shim.py,\
  incidents/management/**,\
  incidents/tests/**

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# pytest-cov writes coverage.xml (Cobertura) into backend/ via `make coverage`.
sonar.python.coverage.reportPaths=coverage.xml

# Wait for the server to compute the Quality Gate and fail the scan (non-zero exit)
# if it's red — so `make sonar-scan` and the pre-commit hook are authoritative.
sonar.qualitygate.wait=true

# Disable SCM blame — the scanner-in-Docker stalls on the SCM Publisher step against
# Docker-Desktop bind mounts on macOS (same workaround as conduct).
sonar.scm.disabled=true
