# Authoritative build-once / promote-by-digest (ADR-004 / ADR-017 / platform#20). Runs in
# CodeBuild. Gates (coverage hard; Sonar when configured), builds + pushes the image to the
# shared ECR ONCE, captures its DIGEST, and emits per-env CodeDeploy artifacts pinned to
# that digest. The pipeline deploys the SAME digest to staging, then (after approval) prod —
# no rebuild in the prod path. Lambdas are packaged once and promoted to both envs.
#
# Env (CodeBuild project, modules/pipeline): ECR_REPO_URL, AWS_ACCOUNT_ID, CONTAINER_NAME,
# CONTAINER_PORT, STAGING_TASK_FAMILY, PROD_TASK_FAMILY, STAGING_HOOK, PROD_HOOK, LAMBDA_ENVS.
version: 0.2

phases:
  install:
    runtime-versions:
      python: "3.12"
    commands:
      - python -m pip install --quiet --upgrade pip

  pre_build:
    commands:
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}"
      - REPO="${ECR_REPO_URL##*/}"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REPO_URL"

  build:
    commands:
      - echo "== coverage gate =="
      - make coverage
      - |
        if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
          docker run --rm -e SONAR_HOST_URL -e SONAR_TOKEN -v "$(pwd)/backend:/usr/src" sonarsource/sonar-scanner-cli:latest
        else echo "== sonar skipped =="; fi
      # Build + push ONCE per commit. The repo is immutable, so if this commit's tag is
      # already there (a re-run / retry), reuse it instead of failing — true build-once.
      - |
        if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
          echo "image ${IMAGE_TAG} already present — reusing"
        else
          docker build -t "${ECR_REPO_URL}:${IMAGE_TAG}" backend/
          docker push "${ECR_REPO_URL}:${IMAGE_TAG}"
        fi
      - DIGEST=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
      - IMAGE_REF="${ECR_REPO_URL}@${DIGEST}"
      - echo "Promoting $IMAGE_REF"
      # Package the Django Lambdas once; promote the same zip to BOTH envs' functions.
      - rm -rf lambda_build && mkdir lambda_build
      - pip install --quiet -r escalation/lambdas/requirements.txt -t lambda_build
      - cp -r backend/config backend/incidents lambda_build/
      - cp escalation/lambdas/record_token.py escalation/lambdas/commit.py escalation/lambdas/_bootstrap.py lambda_build/
      - cp escalation/lambdas/intake_consumer.py lambda_build/intake_consumer.py
      - (cd lambda_build && zip -qr ../lambda.zip .)
      - aws s3 cp lambda.zip "s3://${ARTIFACT_BUCKET}/lambda/${IMAGE_TAG}.zip"
      # PUBLISH the zip; do NOT promote it. Build must not mutate the running estate.
      #
      # This used to call `aws lambda update-function-code` right here, which deadlocked a fresh
      # `make live` (platform#62): new Lambda code met the OLD schema — migrations run later, in the
      # deploy stage's BeforeAllowTraffic hook — so every Step Functions execution failed, which
      # tripped the escalation-failed deploy-gate alarm, which made CodeDeploy refuse to install,
      # which meant the migrations that would have fixed it never ran. Re-running never helped.
      #
      # The promotion now happens in the deploy stage, after migrations, keyed off this file.
      - echo "lambda/${IMAGE_TAG}.zip" > lambda-key.txt

  post_build:
    commands:
      # Render per-env taskdef (image pinned by digest) + appspec (env's hook). One self-
      # contained block per env — CodeBuild persists vars but NOT functions across commands.
      - |
        SHA=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}" | cut -c1-7)
        for spec in "staging $STAGING_TASK_FAMILY $STAGING_HOOK" "prod $PROD_TASK_FAMILY $PROD_HOOK"; do
          set -- $spec; ENVN=$1; FAMILY=$2; HOOK=$3
          # Swap the app image to the built digest, and set service.version=<git sha> in the
          # app container's OTEL_RESOURCE_ATTRIBUTES (ADR-016 / platform#18). deployment.environment
          # stays as baked by terraform.
          aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition' --output json \
          | jq --arg img "$IMAGE_REF" --arg c "$CONTAINER_NAME" --arg sha "$SHA" '
              .containerDefinitions = (.containerDefinitions | map(
                if .name==$c then
                  .image=$img
                  | .environment = (.environment | map(
                      if .name=="OTEL_RESOURCE_ATTRIBUTES"
                      then .value = (.value | sub("service\\.version=[^,]*"; "service.version=" + $sha))
                      else . end))
                else . end))
              | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            ' > "taskdef-${ENVN}.json"
          # Only emit a BeforeAllowTraffic hook when this env has one. Prod's migration hook is
          # deferred cross-account (ADR-020) so PROD_HOOK="" -> appspec-prod has no Hooks block.
          if [ -n "$HOOK" ]; then HOOKS_BLOCK=$(printf 'Hooks:\n  - BeforeAllowTraffic: "%s"' "$HOOK"); else HOOKS_BLOCK=""; fi
          cat > "appspec-${ENVN}.yaml" <<YAML
        version: 0.0
        Resources:
          - TargetService:
              Type: AWS::ECS::Service
              Properties:
                TaskDefinition: <TASK_DEFINITION>
                LoadBalancerInfo:
                  ContainerName: ${CONTAINER_NAME}
                  ContainerPort: ${CONTAINER_PORT}
        ${HOOKS_BLOCK}
        YAML
          # The WORKER runs the SAME image as the app, a different command (ADR-025) — but nothing
          # promoted it, so it sat on the `bootstrap` placeholder image in every cloud env and
          # exited 0 forever on an unknown `run_sqs_worker` command (platform#61). It has no load
          # balancer, so it needs no blue/green: a plain ECS rolling deploy driven by an
          # imagedefinitions.json, which swaps the image on the service's own task definition.
          printf '[{"name":"%s","imageUri":"%s"}]\n' "$CONTAINER_NAME" "$IMAGE_REF" \
            > "imagedefinitions-${ENVN}-worker.json"
        done
      - echo "Artifacts:" && ls taskdef-*.json appspec-*.yaml imagedefinitions-*.json

artifacts:
  files:
    - taskdef-staging.json
    - appspec-staging.yaml
    - taskdef-prod.json
    - appspec-prod.yaml
    - imagedefinitions-staging-worker.json
    - imagedefinitions-prod-worker.json
    - lambda-key.txt
