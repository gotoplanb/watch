[project]
name = "watch-cli"
version = "0.1.0"
description = "wt: a development CLI for Watch, over its HTTP API (ADR-056)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wt = "wt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wt"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Help prose and examples read better unbroken than split mid-sentence to fit 100 columns.
"src/wt/parser.py" = ["E501"]
"src/wt/actions.py" = ["E501"]
