# ngrok edge traffic policy for the Watch dev tunnels. tunnel.sh renders this to
# policy.<svc>.local.yml (gitignored, mode 600) with credentials from .env, and passes it to the
# agent. Basic-auth runs at ngrok's edge BEFORE any request reaches the local server, so
# unauthenticated scanners get 401 and never touch the app. HTTP only.
#
# Exception: the public AllowAny endpoints are NOT basic-auth'd, so the status-page SPA served over
# its own tunnel can reach the API cross-origin (a browser won't send basic-auth cross-origin):
#   - /api/status, /api/status/stream — the public status posture (same as status.davestanton.com)
#   - /api/report/*                   — the public incident/check report form (ADR-027, AllowAny)
# Everything else stays password-protected.
on_http_request:
  - name: basic-auth
    expressions:
      - "!req.url.contains('/api/status') && !req.url.contains('/api/report')"
    actions:
      - type: basic-auth
        config:
          realm: "Watch dev tunnel"
          credentials:
            - "__TUNNEL_USER__:__TUNNEL_PASS__"
